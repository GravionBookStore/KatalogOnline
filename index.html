<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Store</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Menyamakan warna background */
        }
        .wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: -30px; /* Memotong banner */
            left: 0;
            width: 100%;
            height: calc(100% + 60px); /* Menambah tinggi agar bawah tidak terpotong */
            border: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <iframe src="https://script.google.com/macros/s/AKfycbwMcTRae0XCDi_BBWDaebNWgLgUg_WtDbUErbL2cyR1FJME1wHHaIyHbDcm9ND7Q4aSlg/exec" allow="camera"></iframe>
    </div>
</body>
</html>
